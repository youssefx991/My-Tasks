syntax = "proto3";

option csharp_namespace = "Lab1.OrderingSystem.OrderService.API.Server";

service OrderServiceProto {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}

message CreateOrderRequest {
  int32 id = 1;
  int32 userid = 2;
  string username = 3;
  repeated OrderItem items = 4;
}

message OrderItem {
  int32 id = 1;
  string name = 2;
  int32 quantity = 3;
  int32 price = 4;
}

message CreateOrderResponse {
  bool success = 1;
  string message = 2;
}